<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VPN Hackers - We've Moved!</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Roboto', sans-serif;
            background: linear-gradient(135deg, #1a2a6c, #2a3990, #1a2a6c);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            text-align: center;
        }
        
        .container {
            max-width: 800px;
            background-color: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.1);
            animation: fadeIn 1s ease-in-out;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .logo {
            font-size: 3rem;
            margin-bottom: 20px;
            color: #4fc3f7;
        }
        
        h1 {
            font-size: 2.5rem;
            margin-bottom: 20px;
            font-weight: 700;
        }
        
        .message {
            font-size: 1.2rem;
            margin-bottom: 30px;
            line-height: 1.6;
        }
        
        .new-domain {
            font-size: 1.5rem;
            font-weight: 500;
            margin-bottom: 30px;
            color: #4fc3f7;
            word-break: break-all;
        }
        
        .redirect-btn {
            display: inline-block;
            background: linear-gradient(45deg, #4fc3f7, #29b6f6);
            color: white;
            text-decoration: none;
            padding: 15px 30px;
            border-radius: 50px;
            font-size: 1.2rem;
            font-weight: 500;
            margin-bottom: 30px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(79, 195, 247, 0.3);
        }
        
        .redirect-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(79, 195, 247, 0.4);
        }
        
        .countdown {
            font-size: 1rem;
            margin-top: 20px;
            opacity: 0.8;
        }
        
        .footer {
            margin-top: 40px;
            font-size: 0.9rem;
            opacity: 0.7;
        }
        
        .tech-icons {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 30px 0;
        }
        
        .tech-icons i {
            font-size: 2rem;
            color: #4fc3f7;
            opacity: 0.8;
            transition: all 0.3s ease;
        }
        
        .tech-icons i:hover {
            opacity: 1;
            transform: scale(1.1);
        }
        
        @media (max-width: 600px) {
            .container {
                padding: 30px 20px;
            }
            
            h1 {
                font-size: 2rem;
            }
            
            .logo {
                font-size: 2.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <i class="fas fa-shield-alt"></i>
        </div>
        
        <h1>We've Moved!</h1>
        
        <p class="message">
            Our website has moved to a new domain. Please update your bookmarks and visit us at our new home.
        </p>
        
        <div class="tech-icons">
            <i class="fas fa-lock"></i>
            <i class="fas fa-server"></i>
            <i class="fas fa-network-wired"></i>
            <i class="fas fa-user-secret"></i>
        </div>
        
        <p class="new-domain">
            <i class="fas fa-link"></i> vpnhackers.netlify.app
        </p>
        
        <a href="https://vpnhackers.netlify.app" class="redirect-btn">
            Visit Our New Site <i class="fas fa-arrow-right"></i>
        </a>
        
        <p class="countdown">
            You will be redirected automatically in <span id="counter">10</span> seconds.
        </p>
        
        <div class="footer">
            <p>Thank you for your patience! See you on the new site.</p>
        </div>
    </div>

    <script>
        // Countdown redirect
        let seconds = 10;
        const counter = document.getElementById('counter');
        
        const countdown = setInterval(() => {
            seconds--;
            counter.textContent = seconds;
            
            if (seconds <= 0) {
                clearInterval(countdown);
                window.location.href = 'https://vpnhackers.netlify.app';
            }
        }, 1000);
        
        // Add some interactive elements
        document.addEventListener('DOMContentLoaded', () => {
            const techIcons = document.querySelectorAll('.tech-icons i');
            
            techIcons.forEach(icon => {
                icon.addEventListener('click', () => {
                    // Create a ripple effect
                    icon.style.transform = 'scale(1.3)';
                    setTimeout(() => {
                        icon.style.transform = 'scale(1)';
                    }, 300);
                });
            });
        });
    </script>
</body>
</html>
